server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Optional: Avoid 403 on trailing slashes like /login/
  location ~ ^/(.*)/$ {
    try_files /$1 /index.html;
  }

  # Optional: Serve service worker, manifest, etc.
  location ~* \.(?:manifest|appcache|html?|xml|json)$ {
    try_files $uri =404;
  }

  # Cache static assets
  location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|woff2?|ttf|svg|eot)$ {
    try_files $uri =404;
    expires 6M;
    access_log off;
    add_header Cache-Control "public";
  }

  error_page 404 /index.html;
}
